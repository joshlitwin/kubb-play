<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css">
    <!-- Fredoka (SIL Open Font Licence), the game's font. See ASSETS.md. -->
    <link rel="stylesheet" href="./fonts.css">
    <!-- Fetch the splash's two fonts straight away, so its title doesn't swap font halfway in. -->
    <link rel="preload" href="./assets/fonts/bebas-neue-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/caveat-600-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>Kubb</title>
  <script type="module" crossorigin src="./assets/index-wQlPaN-p.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-DkrQsNE3.js">
</head>

<body>
    <!-- The title card: plain HTML so it shows the moment the page opens, before the fonts and the
         game have loaded. src/main.ts fades it out once the first screen has been drawn. -->
    <div id="splash" role="status" aria-live="polite">
        <div class="splash-title">Kubb</div>
        <div class="splash-line">setting up the lawn<span class="splash-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
    <script>
        // If the game hasn't drawn its first screen after 15 seconds, offer a fresh copy instead of a splash that never
        // ends (Josh's phone, 2026-10-17: it held a page from an earlier publish whose script was gone). The added `r`
        // skips the phone's cached page; the game ignores it.
        setTimeout(function () {
            var s = document.getElementById('splash');
            if (!s || s.classList.contains('leaving')) return;
            var b = document.createElement('button');
            b.className = 'splash-reload';
            b.textContent = 'Still loading? Tap to reload';
            b.onclick = function () { var u = new URL(location.href); u.searchParams.set('r', String(Date.now())); location.replace(u.toString()); };
            s.appendChild(b);
        }, 15000);
    </script>
    <div id="app">
        <div id="game-container"></div>
    </div>
</body>
</html>
